<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platformer Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        <div id="ui-layer">
            <div class="hud">
                <div class="stat">SCORE: <span id="score">0</span></div>
                <div class="stat">LIVES: <span id="lives">3</span></div>
                <div class="stat">LEVEL: <span id="level">1</span></div>
                <button id="btn-pause" style="padding: 5px 10px; font-size: 10px;">PAUSE (P)</button>
            </div>
            
            <div id="screen-start" class="screen">
                <h1>SUPER BLOCK BROS</h1>
                <p>Use LEFT/RIGHT to Move, SPACE to Jump</p>
                <div class="settings-panel">
                    <label>Player Name:</label>
                    <input type="text" id="player-name" placeholder="Enter your name" value="Mario">
                    <label>Player Speed: <span id="speed-val">5</span></label>
                    <input type="range" id="speed-slider" min="2" max="15" step="0.5" value="5">
                </div>
                <div style="display: flex; gap: 10px;">
                    <button id="btn-start">START GAME</button>
                    <button id="btn-history-start" style="background-color: #34495e; border-color: #2c3e50;">HISTORY</button>
                </div>
            </div>
            
            <div id="screen-pause" class="screen hidden">
                <h1>PAUSED</h1>
                <div class="settings-panel">
                    <button id="btn-resume">RESUME GAME</button>
                    <button id="btn-restart-pause">NEW GAME</button>
                    <button id="btn-history" style="background-color: #34495e; border-color: #2c3e50;">PLAY HISTORY</button>
                </div>
            </div>

            <div id="screen-history" class="screen hidden">
                <h1>PLAY HISTORY</h1>
                <div id="history-content" style="max-height: 200px; overflow-y: auto; text-align: left; background: rgba(0,0,0,0.5); padding: 10px; margin-bottom: 20px; width: 80%;">
                </div>
                <button id="btn-history-close">CLOSE</button>
            </div>

            <div id="screen-gameover" class="screen hidden">
                <h1 style="color: #e74c3c;">GAME OVER</h1>
                <p id="gameover-message" style="font-size: 10px; margin-bottom: 20px; text-align: center; color: #ecf0f1; line-height: 1.5;"></p>
                <div style="background: rgba(0,0,0,0.6); padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: left; line-height: 2;">
                    <p style="margin: 0; font-size: 14px;">Total Score: <span id="final-score" style="color:#f1c40f">0</span></p>
                    <p style="margin: 0; font-size: 14px;">Enemies Defeated: <span id="final-enemies" style="color:#f1c40f">0</span></p>
                </div>
                <button id="btn-restart">RESTART</button>
            </div>

            <div id="screen-win" class="screen hidden">
                <h1 style="color: #2ecc71; text-shadow: 2px 2px 0 #000;">LEVEL CLEARED!</h1>
                <div style="background: rgba(0,0,0,0.6); padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: left; line-height: 2;">
                    <p style="margin: 0; font-size: 14px;">Base Score: <span id="win-base-score" style="color:#f1c40f">0</span></p>
                    <p style="margin: 0; font-size: 14px;">Lives Bonus: <span id="win-lives-bonus" style="color:#f1c40f">0</span></p>
                    <hr style="border-color: #7f8c8d; margin-top:5px; margin-bottom: 5px;">
                    <p style="margin: 0; color: #e74c3c; font-size: 18px;">TOTAL: <span id="win-score">0</span></p>
                </div>
                <button id="btn-next-level">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
